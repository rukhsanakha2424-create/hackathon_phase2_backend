[project]
name = "todo-backend"
version = "0.1.0"
description = "Phase II FastAPI backend for the Multi-Phase Todo Application"
authors = [{ name = "Claude Code" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.110.0",
    "uvicorn[standard]~=0.29.0",
    "sqlmodel~=0.0.16",
    "pydantic-settings~=2.2.1",
    "psycopg[binary]~=3.1.18",
    "alembic~=1.13.1",
    "python-dotenv~=1.0.1",
    "loguru~=0.7.2"
]

dynamic = ["classifiers"]

[project.optional-dependencies]
dev = [
    "pytest~=8.1.1",
    "pytest-asyncio~=0.23.6",
    "httpx~=0.27.0"
]

[tool.uvicorn]
factory = false
app = "app.main:app"
reload = true
host = "0.0.0.0"
port = 8000
